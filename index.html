<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS — INFINITY™ REAL-TIME</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --main:#00aaff;
  --accent:#00eeff;
  --bg:#020810;
  --panel:rgba(4,15,30,0.98);
  --glow:rgba(0,170,255,0.3);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:var(--bg);
  color:#c0e8ff;
  font-family:'Rajdhani',sans-serif;
  overflow:hidden;
  height:100vh;
  width:100vw;
  transition:background 1s,color 1s;
}

/* INTRO */
#intro{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:20px;
  z-index:9999;
}

.inf-logo{
  width:150px;
  stroke:var(--main);
  stroke-width:2.5;
  fill:none;
  animation:draw 3s infinite alternate;
}

@keyframes draw{
  0%{stroke-dasharray:0 500;}
  100%{
    stroke-dasharray:500 0;
    filter:drop-shadow(0 0 30px var(--main));
  }
}

.intro-text{
  font-family:'Orbitron';
  color:var(--main);
  letter-spacing:4px;
  font-size:12px;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%,100%{opacity:.4;}
  50%{opacity:1;}
}

/* APP */
#app{
  opacity:0;
  height:100%;
  display:flex;
  flex-direction:column;
  transition:opacity 1s;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 16px;
  background:rgba(2,8,16,.92);
  border-bottom:1px solid rgba(0,170,255,.2);
}

.logo{
  font-family:'Orbitron';
  color:var(--main);
  letter-spacing:2px;
  font-size:14px;
}

#clock{
  color:var(--main);
  font-family:'Orbitron';
  font-size:13px;
}

/* THEME BUTTONS */
.theme-btns{
  display:flex;
  gap:6px;
}

.theme-dot{
  width:18px;
  height:18px;
  border-radius:50%;
  cursor:pointer;
  transition:.2s;
}

.theme-dot:hover{
  transform:scale(1.2);
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  padding:20px;
}

/* ORB */
.orb-wrap{
  position:relative;
}

.orb-ring{
  position:absolute;
  border-radius:50%;
  border:1px solid var(--main);
  opacity:.2;
  animation:orbPulse 3s infinite;
}

.orb-ring:nth-child(1){
  width:180px;
  height:180px;
  top:-20px;
  left:-20px;
}

.orb-ring:nth-child(2){
  width:220px;
  height:220px;
  top:-40px;
  left:-40px;
  animation-delay:1s;
}

@keyframes orbPulse{
  0%,100%{
    transform:scale(1);
    opacity:.1;
  }
  50%{
    transform:scale(1.05);
    opacity:.3;
  }
}

.orb{
  width:140px;
  height:140px;
  border-radius:50%;
  border:2px solid var(--main);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 0 25px var(--glow);
  transition:.3s;
  position:relative;
}

.orb:hover{
  box-shadow:
  0 0 30px var(--main),
  0 0 60px var(--glow);
}

.orb-inner{
  width:90px;
  height:90px;
  border-radius:50%;
  background:radial-gradient(circle,var(--main),transparent 80%);
  opacity:.6;
}

.listening{
  box-shadow:
  0 0 40px var(--main),
  inset 0 0 20px var(--glow);
}

/* STATUS */
#status{
  color:var(--main);
  letter-spacing:2px;
  font-size:12px;
}

/* PANEL */
.panel{
  width:100%;
  max-width:500px;
  background:var(--panel);
  border:1px solid var(--main);
  border-radius:20px;
  padding:18px;
  backdrop-filter:blur(20px);
}

.panel-title{
  color:var(--main);
  margin-bottom:10px;
  letter-spacing:2px;
  font-size:11px;
}

#chat-input{
  width:100%;
  background:rgba(0,0,0,.4);
  border:1px solid var(--main);
  color:var(--main);
  padding:12px;
  border-radius:12px;
  outline:none;
  font-family:'Rajdhani';
  font-size:15px;
}

#chat-input::placeholder{
  color:#888;
}

/* NEWS */
.news{
  margin-top:15px;
  max-height:220px;
  overflow:auto;
}

.news::-webkit-scrollbar{
  width:4px;
}

.news::-webkit-scrollbar-thumb{
  background:var(--main);
  border-radius:10px;
}

.news-card{
  padding:12px;
  border-left:3px solid var(--main);
  background:rgba(255,255,255,.03);
  border-radius:12px;
  margin-bottom:10px;
}

.news-cat{
  font-size:10px;
  opacity:.6;
  margin-bottom:5px;
}

/* WHITE THEME FIX */
.white-mode header{
  background:rgba(255,255,255,.85);
}

.white-mode #chat-input{
  background:#fff;
}

/* RGB BAR */
#rgb-bar{
  height:3px;
  width:100%;
  background:linear-gradient(
  90deg,
  #ff0000,
  #ff8800,
  #ffff00,
  #00ff00,
  #00ffff,
  #0088ff,
  #ff00ff,
  #ff0000
  );
  background-size:200% 100%;
  animation:rgb 4s linear infinite;
}

@keyframes rgb{
  0%{background-position:0% 50%;}
  100%{background-position:200% 50%;}
}
</style>
</head>

<body>

<div id="intro">
  <svg class="inf-logo" viewBox="0 0 100 50">
    <path d="M30,25 C30,15 15,15 15,25 C15,35 30,35 30,25 C30,15 45,15 45,25 C45,35 30,35 30,25"/>
  </svg>

  <div class="intro-text">
    SİSTEM BAŞLATILIYOR...
  </div>
</div>

<div id="app">

  <div id="rgb-bar"></div>

  <header>

    <div class="logo">JARVIS</div>

    <div id="clock">00:00</div>

    <div class="theme-btns">

      <div class="theme-dot"
      onclick="setTheme('blue')"
      style="background:#00aaff;">
      </div>

      <div class="theme-dot"
      onclick="setTheme('purple')"
      style="background:#bf00ff;">
      </div>

      <div class="theme-dot"
      onclick="setTheme('green')"
      style="background:#00ff88;">
      </div>

      <div class="theme-dot"
      onclick="setTheme('orange')"
      style="background:#ff8800;">
      </div>

      <div class="theme-dot"
      onclick="setTheme('red')"
      style="background:#ff3333;">
      </div>

      <!-- WHITE THEME -->
      <div class="theme-dot"
      onclick="setTheme('white')"
      style="
      background:#ffffff;
      border:1px solid #999;">
      </div>

    </div>

  </header>

  <div class="main">

    <div class="orb-wrap">

      <div class="orb-ring"></div>
      <div class="orb-ring"></div>

      <div class="orb" id="orb" onclick="toggleMic()">
        <div class="orb-inner"></div>
      </div>

    </div>

    <div id="status">◆ HAZIR ◆</div>

    <div class="panel">

      <div class="panel-title">
        ◈ KOMUT PANELİ
      </div>

      <input
      type="text"
      id="chat-input"
      placeholder="Komut gir..."
      onkeypress="handleChat(event)">

      <div class="news" id="news">

        <div class="news-card">
          <div class="news-cat">TEKNOLOJİ</div>
          Yapay zekâ destekli yeni sistemler tanıtıldı.
        </div>

        <div class="news-card">
          <div class="news-cat">UZAY</div>
          NASA yeni Ay görevini duyurdu.
        </div>

        <div class="news-card">
          <div class="news-cat">SPOR</div>
          Süper Lig'de zirve yarışı devam ediyor.
        </div>

      </div>

    </div>

  </div>

</div>

<script>
let isListening=false;

const THEMES={

blue:{
main:'#00aaff',
accent:'#00eeff',
glow:'rgba(0,170,255,.3)',
bg:'#020810',
panel:'rgba(4,15,30,.98)',
body:'#c0e8ff'
},

purple:{
main:'#bf00ff',
accent:'#df44ff',
glow:'rgba(191,0,255,.3)',
bg:'#0a0010',
panel:'rgba(15,4,30,.98)',
body:'#f0d0ff'
},

green:{
main:'#00ff88',
accent:'#55ffaa',
glow:'rgba(0,255,136,.3)',
bg:'#021008',
panel:'rgba(4,30,15,.98)',
body:'#c0ffe0'
},

orange:{
main:'#ff8800',
accent:'#ffaa33',
glow:'rgba(255,136,0,.3)',
bg:'#100802',
panel:'rgba(30,15,4,.98)',
body:'#ffe8c0'
},

red:{
main:'#ff3333',
accent:'#ff6666',
glow:'rgba(255,51,51,.3)',
bg:'#100202',
panel:'rgba(30,4,4,.98)',
body:'#ffd0d0'
},

white:{
main:'#1a1a2e',
accent:'#444488',
glow:'rgba(26,26,46,.2)',
bg:'#eef3ff',
panel:'rgba(255,255,255,.92)',
body:'#111827'
}

};

function setTheme(name){

const t=THEMES[name];

document.documentElement.style.setProperty('--main',t.main);
document.documentElement.style.setProperty('--accent',t.accent);
document.documentElement.style.setProperty('--glow',t.glow);
document.documentElement.style.setProperty('--bg',t.bg);
document.documentElement.style.setProperty('--panel',t.panel);

document.body.style.color=t.body;

if(name==="white"){
document.body.classList.add("white-mode");
}else{
document.body.classList.remove("white-mode");
}

}

function updateClock(){
document.getElementById("clock").innerText=
new Date().toLocaleTimeString('tr-TR',{
hour:'2-digit',
minute:'2-digit',
second:'2-digit'
});
}

setInterval(updateClock,1000);
updateClock();

function toggleMic(){

const orb=document.getElementById("orb");
const status=document.getElementById("status");

isListening=!isListening;

if(isListening){
orb.classList.add("listening");
status.innerText="● DİNLİYORUM...";
}else{
orb.classList.remove("listening");
status.innerText="◆ HAZIR ◆";
}

}

function handleChat(e){

if(e.key==="Enter"){

let msg=e.target.value.toLowerCase();

if(msg.includes("selam")){
speak("Merhaba Efendim.");
}

else if(msg.includes("saat")){
speak("Saat " +
new Date().toLocaleTimeString('tr-TR'));
}

else{
speak("Komut alındı Efendim.");
}

e.target.value="";
}

}

function speak(text){

document.getElementById("status").innerText=text;

const u=new SpeechSynthesisUtterance(text);

u.lang='tr-TR';

speechSynthesis.cancel();
speechSynthesis.speak(u);

}

setTimeout(()=>{

document.getElementById("intro").style.display="none";
document.getElementById("app").style.opacity="1";

},2200);
</script>

</body>
</html>
